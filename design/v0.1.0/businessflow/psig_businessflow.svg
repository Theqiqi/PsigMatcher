<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" font-family="sans-serif" font-size="13">
  <rect width="760" height="560" fill="#fbfbfb"/>
  <text x="20" y="28" font-size="17" font-weight="bold">psig 业务流程图（BF1 进程枚举 / BF2 批量扫描）</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#333"/>
    </marker>
  </defs>

  <rect x="270" y="50" width="220" height="36" rx="8" fill="#d9e8ff" stroke="#3a6ea5"/>
  <text x="300" y="73">GUI 发起扫描请求</text>

  <rect x="270" y="110" width="220" height="36" rx="8" fill="#e8f5e9" stroke="#3a8a4a"/>
  <text x="300" y="133">解析模式串 (FP2)</text>

  <rect x="270" y="170" width="220" height="36" rx="8" fill="#fff3cd" stroke="#b58900"/>
  <text x="300" y="193">对每个目标进程</text>

  <rect x="270" y="230" width="220" height="36" rx="8" fill="#e8eaf6" stroke="#5c6bc0"/>
  <text x="290" y="253">打开进程 + 枚举模块</text>

  <rect x="270" y="290" width="220" height="36" rx="8" fill="#e8eaf6" stroke="#5c6bc0"/>
  <text x="290" y="313">枚举可读区域 + 读取</text>

  <rect x="270" y="350" width="220" height="36" rx="8" fill="#e8f5e9" stroke="#3a8a4a"/>
  <text x="290" y="373">掩码匹配 (FP6) 命中</text>

  <rect x="270" y="410" width="220" height="36" rx="8" fill="#fce4ec" stroke="#c2185b"/>
  <text x="300" y="433">取消? 是→返回部分</text>

  <rect x="270" y="470" width="220" height="36" rx="8" fill="#d9e8ff" stroke="#3a6ea5"/>
  <text x="290" y="493">汇总 MatchResult 列表</text>

  <line x1="380" y1="86" x2="380" y2="110" stroke="#333" marker-end="url(#a)"/>
  <line x1="380" y1="146" x2="380" y2="170" stroke="#333" marker-end="url(#a)"/>
  <line x1="380" y1="206" x2="380" y2="230" stroke="#333" marker-end="url(#a)"/>
  <line x1="380" y1="266" x2="380" y2="290" stroke="#333" marker-end="url(#a)"/>
  <line x1="380" y1="326" x2="380" y2="350" stroke="#333" marker-end="url(#a)"/>
  <line x1="380" y1="386" x2="380" y2="410" stroke="#333" marker-end="url(#a)"/>
  <line x1="380" y1="446" x2="380" y2="470" stroke="#333" marker-end="url(#a)"/>

  <text x="600" y="200" fill="#666">进度回调 → GUI</text>
  <line x1="490" y1="248" x2="595" y2="210" stroke="#999" stroke-dasharray="4" marker-end="url(#a)"/>
</svg>
