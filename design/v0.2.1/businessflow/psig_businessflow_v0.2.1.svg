<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <text x="20" y="28" font-size="18" font-weight="bold">psig 业务流程图 v0.2.1（增量：CSV BOM / 进程图标）</text>

  <!-- CSV 导出加 BOM -->
  <rect x="40" y="60" width="200" height="44" rx="8" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="140" y="87" text-anchor="middle">导出特征码/结果 CSV</text>

  <rect x="320" y="60" width="220" height="44" rx="8" fill="#fff3e0" stroke="#ef6c00"/>
  <text x="430" y="87" text-anchor="middle">最前拼接 UTF-8 BOM</text>

  <rect x="620" y="60" width="260" height="44" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="750" y="87" text-anchor="middle">文件首 EF BB BF（Excel 不乱码）</text>

  <!-- CSV 导入剥 BOM -->
  <rect x="40" y="150" width="200" height="44" rx="8" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="140" y="177" text-anchor="middle">导入特征码 CSV</text>

  <rect x="320" y="150" width="220" height="44" rx="8" fill="#fff3e0" stroke="#ef6c00"/>
  <text x="430" y="177" text-anchor="middle">识别并剥离 BOM</text>

  <rect x="620" y="150" width="260" height="44" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="750" y="177" text-anchor="middle">Table（首列/模板不受污染）</text>

  <!-- 进程图标 -->
  <rect x="40" y="250" width="200" height="44" rx="8" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="140" y="277" text-anchor="middle">pid</text>

  <rect x="320" y="250" width="220" height="44" rx="8" fill="#f3e5f5" stroke="#6a1b9a"/>
  <text x="430" y="277" text-anchor="middle">Win32 提取图标 → BGRA</text>

  <rect x="620" y="250" width="260" height="44" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="750" y="277" text-anchor="middle">IconBitmap（可建 QImage）</text>

  <!-- 默认图标 -->
  <rect x="320" y="340" width="220" height="44" rx="8" fill="#f3e5f5" stroke="#6a1b9a"/>
  <text x="430" y="367" text-anchor="middle">系统默认 exe 图标 → BGRA</text>

  <rect x="620" y="340" width="260" height="44" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="750" y="367" text-anchor="middle">IconBitmap（无图标回退）</text>

  <line x1="240" y1="82" x2="320" y2="82" stroke="#555" marker-end="url(#a)"/>
  <line x1="540" y1="82" x2="620" y2="82" stroke="#555" marker-end="url(#a)"/>
  <line x1="240" y1="172" x2="320" y2="172" stroke="#555" marker-end="url(#a)"/>
  <line x1="540" y1="172" x2="620" y2="172" stroke="#555" marker-end="url(#a)"/>
  <line x1="240" y1="272" x2="320" y2="272" stroke="#555" marker-end="url(#a)"/>
  <line x1="540" y1="272" x2="620" y2="272" stroke="#555" marker-end="url(#a)"/>
  <line x1="540" y1="362" x2="620" y2="362" stroke="#555" marker-end="url(#a)"/>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#555"/>
    </marker>
  </defs>
</svg>
